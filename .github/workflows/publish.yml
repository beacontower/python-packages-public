name: Publish

# Publishes `beacontower` to PyPI when a GitHub release is published. It uses PyPI's
# trusted publishing (no token): the project on PyPI must name this repository, this
# workflow file and the environment `pypi` as its trusted publisher.
#
# The version is CalVer (beacontower/VERSIONING.md) and comes from the release's tag:
# v2026.11.24.1 publishes 2026.11.24.1. setup.py reads it from PACKAGE_VERSION. PyPI
# refuses a version it has seen before, so a second release on a day raises the last part.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - name: Version from the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}\.[0-9]+$ ]]; then
            echo "::error::The release tag '$TAG' is not CalVer vYYYY.MM.DD.Rev (beacontower/VERSIONING.md)."
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build
        run: pip install build && python -m build beacontower
      - name: Check the built version
        run: |
          ls beacontower/dist
          test -f "beacontower/dist/beacontower-${PACKAGE_VERSION}-py3-none-any.whl"
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: beacontower/dist
