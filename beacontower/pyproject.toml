[project]
name = "beacontower"
dynamic = ["version"]
dependencies = [
    "pydantic~=2.9",
    "httpx>=0.27,<1",
    "pandas>=2.2,<4",
]
requires-python = ">= 3.11"
authors = [{ name = "Glaze Holding AB" }]
description = "Python client for Beacon Tower: assets, models and devices, their timeseries, and the data provider's sources"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/beacontower/python-packages-public"

[project.optional-dependencies]
# Reading timeseries straight from TimescaleDB; the timeseries API needs none of it.
postgres = ["psycopg[binary,pool]~=3.1"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "psycopg[binary,pool]~=3.1"]

[build-system]
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

# `beacontower` is a namespace shared with other distributions: it has no __init__.py,
# and this distribution owns only the packages below it.
[tool.setuptools.packages.find]
where = ["src"]
include = ["beacontower.*"]

[tool.setuptools.package-data]
"beacontower.metadata" = ["py.typed"]
"beacontower.timeseries" = ["py.typed"]
"beacontower.dataproviders" = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint.isort]
# This distribution owns every module below beacontower it imports.
known-first-party = ["beacontower"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # incorrectly requires commas for strings in log messages
    "D203",   # one-blank-line-before-class
    "D212",   # summary line in docstrings will start with the second raw
    "D413",   # not applicable for numpy docstrings
    "EM101",  # raw-string-in-exception
    "EM102",  # we want to use f string in exception messages
    "FA100",  # we want to avoid importing __future__
    "G004",   # we want to use f string in log messages
    "TRY003", # we want to write long exception messages
    "TD002",  #TODO need no ticket
    "TD003",  #TODO need no author
    "FIX002", #TODO is for the future, not now
    "RUF013", #Explicit optional parameters are suboptimal, but fine-ish
    "D107",   #Don't require docstring for __init__
    "CPY001", # we don't use copyright headers
    "D213",   # summary on the second line; D212 (the first line) is ignored too, so either style passes
    "D205",   # don't require a blank line after the docstring summary
    "D209",   # don't require the closing quotes on their own line
    "D415",   # don't require summary to end with . ? ! (D400's period is enough)
    "ANN401", # typing.Any is suboptimal but often necessary
    "FBT001", # boolean positional args are a deliberate API choice (do_twa, etc.)
    "FBT002", # boolean positional-default args, same
]

[tool.ruff.lint.per-file-ignores]
# Tests can be messy -- pytest is the real gate for them; don't lint them for now.
"tests/**" = ["ALL"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.mypy]
python_version = "3.11"
# Strict: every function typed, no implicit Any; CI runs mypy on src/ only.
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# Resolve modules below the beacontower namespace from src/. Without these, mypy names
# them after the first folder that has an __init__.py and quietly drops their types.
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[tool.pydoclint]
allow-init-docstring = true
